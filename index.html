<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Your Click</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
  <header>
    <h1>Add Your Click</h1>
  </header>

  <main id="body">
    <h2>Click as much as you can</h2>

    <form id="click-form" novalidate>
      <fieldset id="signup">
        <legend>Add Clicks</legend>

        <p class="counter-label">Total clicks</p>
        <p class="counter-value" id="click-count" aria-live="polite">0</p>

        <input type="submit" value="Click">
        <button type="button" id="reset-btn" class="secondary-btn">Reset</button>
      </fieldset>

      <p>
        <a href="#" id="save-info">Saved locally in your browser.</a>
      </p>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
